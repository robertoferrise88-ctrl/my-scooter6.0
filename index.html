<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07121d"
    >

    <title>My Scooter</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #07121d;
            color: white;

            overflow-x: hidden;
        }


        /* =========================
           HOME
        ========================= */

        .home {
            position: relative;

            width: 100%;
            min-height: 100vh;

            display: flex;
            flex-direction: column;

            overflow: hidden;

            background-image:
                linear-gradient(
                    90deg,
                    rgba(5, 16, 29, 0.96) 0%,
                    rgba(5, 16, 29, 0.82) 32%,
                    rgba(5, 16, 29, 0.35) 58%,
                    rgba(60, 170, 150, 0.10) 100%
                ),
                url("hero.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }


        /* leichte dunkle Ebene */

        .overlay {
            position: absolute;

            inset: 0;

            background:
                radial-gradient(
                    circle at 80% 50%,
                    rgba(85, 220, 180, 0.12),
                    transparent 35%
                );

            pointer-events: none;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .navbar {
            position: relative;
            z-index: 5;

            width: 100%;

            padding:
                28px
                5vw;

            display: flex;

            align-items: center;
            justify-content: space-between;
        }


        .logo {
            display: flex;

            align-items: center;

            gap: 12px;
        }


        .logo-icon {
            width: 42px;
            height: 42px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 12px;

            background:
                rgba(80, 210, 180, 0.10);

            border:
                1px solid
                rgba(100, 230, 190, 0.35);

            color: #69e0bd;

            font-size: 23px;
        }


        .logo-text {
            font-size: 19px;

            font-weight: 800;

            letter-spacing: 1px;
        }


        .nav-links {
            display: flex;

            align-items: center;

            gap: 38px;
        }


        .nav-links a {
            position: relative;

            color: rgba(255,255,255,0.75);

            text-decoration: none;

            font-size: 13px;

            font-weight: 600;

            transition:
                color 0.2s ease;
        }


        .nav-links a:hover {
            color: white;
        }


        .nav-links a.active {
            color: #63dcb8;
        }


        .nav-links a.active::after {
            content: "";

            position: absolute;

            left: 0;
            right: 0;

            bottom: -9px;

            height: 2px;

            border-radius: 10px;

            background: #63dcb8;
        }


        /* =========================
           HERO CONTENT
        ========================= */

        .hero-content {
            position: relative;
            z-index: 3;

            flex: 1;

            width: 100%;

            max-width: 1400px;

            margin: auto;

            padding:
                50px 6vw
                100px;

            display: flex;

            align-items: center;
        }


        .hero-text {
            max-width: 560px;

            margin-top: -20px;
        }


        .small-title {
            margin-bottom: 18px;

            color: #69e0bd;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        .hero-title {
            font-size:
                clamp(58px, 7vw, 105px);

            line-height: 0.95;

            letter-spacing: -5px;

            font-weight: 800;

            margin-bottom: 25px;
        }


        .hero-title span {
            display: block;

            color: #66dfba;
        }


        .hero-description {
            max-width: 460px;

            color:
                rgba(255,255,255,0.68);

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 35px;
        }


        /* =========================
           BUTTON
        ========================= */

        .dashboard-button {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 18px;

            min-width: 210px;

            padding:
                17px
                25px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #77e4bf,
                    #55cdb0
                );

            color: #06131b;

            text-decoration: none;

            font-size: 14px;

            font-weight: 800;

            letter-spacing: 0.5px;

            box-shadow:
                0 15px 45px
                rgba(72, 210, 170, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .dashboard-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 20px 55px
                rgba(72, 210, 170, 0.35);
        }


        .arrow {
            font-size: 20px;

            transition:
                transform 0.2s ease;
        }


        .dashboard-button:hover .arrow {
            transform: translateX(5px);
        }


        /* =========================
           BOTTOM INFO
        ========================= */

        .bottom-info {
            position: absolute;

            z-index: 4;

            left: 6vw;
            bottom: 35px;

            display: flex;

            gap: 35px;

            color:
                rgba(255,255,255,0.45);

            font-size: 11px;

            letter-spacing: 1px;
        }


        .bottom-info span {
            display: flex;

            align-items: center;

            gap: 8px;
        }


        .green-dot {
            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #62ddb8;

            box-shadow:
                0 0 10px
                rgba(98,221,184,0.7);
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 800px) {

            .navbar {
                padding:
                    20px 20px;
            }


            .nav-links {
                display: none;
            }


            .hero {
                min-height: 100svh;
            }


            .hero-content {
                align-items: flex-end;

                padding:
                    40px 24px
                    110px;
            }


            .hero-text {
                max-width: 100%;
            }


            .hero-title {
                font-size:
                    clamp(52px, 15vw, 80px);

                letter-spacing: -3px;
            }


            .hero-description {
                font-size: 14px;

                max-width: 360px;
            }


            .bottom-info {
                left: 24px;

                bottom: 30px;

                gap: 15px;

                flex-wrap: wrap;
            }

        }


        @media (max-width: 480px) {

            .logo-text {
                font-size: 16px;
            }


            .logo-icon {
                width: 38px;
                height: 38px;
            }


            .hero-content {
                padding:
                    30px 20px
                    105px;
            }


            .hero-title {
                font-size: 55px;

                line-height: 0.94;
            }


            .hero-description {
                font-size: 13px;

                line-height: 1.6;

                margin-bottom: 28px;
            }


            .dashboard-button {
                width: 100%;

                min-width: 0;
            }

        }

    </style>
</head>


<body>

    <main class="home">

        <div class="overlay"></div>


        <!-- NAVIGATION -->

        <header class="navbar">

            <div class="logo">

                <div class="logo-icon">
                    🛴
                </div>

                <div class="logo-text">
                    MY SCOOTER
                </div>

            </div>


            <nav class="nav-links">

                <a
                    href="index.html"
                    class="active"
                >
                    HOME
                </a>

                <a href="dashboard.html">
                    DASHBOARD
                </a>

                <a href="#features">
                    FEATURES
                </a>

                <a href="#contact">
                    CONTACT
                </a>

            </nav>

        </header>


        <!-- HERO -->

        <section class="hero-content">

            <div class="hero-text">

                <div class="small-title">
                    SMART ELECTRIC MOBILITY
                </div>


                <h1 class="hero-title">

                    Move

                    <span>
                        The Future
                    </span>

                </h1>


                <p class="hero-description">

                    Dein persönliches Scooter-Dashboard.
                    Verbinde deinen E-Scooter, überwache
                    Akku und Geschwindigkeit und behalte
                    alle wichtigen Informationen im Blick.

                </p>


                <a
                    href="dashboard.html"
                    class="dashboard-button"
                >

                    DASHBOARD ÖFFNEN

                    <span class="arrow">
                        →
                    </span>

                </a>

            </div>

        </section>


        <!-- BOTTOM -->

        <div class="bottom-info">

            <span>

                <span class="green-dot"></span>

                SMART SCOOTER

            </span>


            <span>
                BLE READY
            </span>


            <span>
                MY SCOOTER
            </span>

        </div>

    </main>


</body>
</html>
